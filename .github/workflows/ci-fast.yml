# CI-fast: every push and pull request.
#
# Answers one question: does a fresh public clone of EvoCFD stand on its own,
# with no external RSI-Harness checkout present? EvoCFD's own tests must pass
# and `check:rsih` must fail cleanly rather than silently degrade.
#
# This is deliberately infrastructure-free: no services, no containers, no
# network beyond the checkout itself. Slow integration checks live in
# ci-rsih.yml and are run nightly or on demand.

name: CI-fast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: EvoCFD checks (no external checkout required)
        run: npm run check

      - name: Environment report
        run: npm run doctor

      - name: check:rsih must fail when RSI-Harness is absent
        run: |
          if npm run check:rsih; then
            echo "::error::check:rsih unexpectedly succeeded; a fresh public clone has no RSI-Harness checkout"
            exit 1
          fi
          echo "check:rsih correctly failed with no checkout present"
